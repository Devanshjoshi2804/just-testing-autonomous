version: '3.8'

services:
  # ============================================================================
  # Main API Service - FastAPI Backend
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-rl-api
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reload during development
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
      - ./uploads:/app/uploads
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LLM_MODEL=${LLM_MODEL:-llama3.2:3b}
      - FAST_LLM_MODEL=${FAST_LLM_MODEL:-llama3.2:3b}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - LLAMAPARSE_API_KEY=${LLAMAPARSE_API_KEY}
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - chromadb
      - redis
      - ollama
    networks:
      - autotest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Ollama - Local LLM Server (Lightweight Models)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: autotest-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      # Performance tuning
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=2
    networks:
      - autotest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Uncomment below for GPU support (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================================================
  # Ollama Model Loader - Auto-downloads models on startup
  # ============================================================================
  ollama_loader:
    image: curlimages/curl:latest
    container_name: autotest-ollama-loader
    depends_on:
      - ollama
    networks:
      - autotest-network
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Ollama to be ready...';
        until curl -f http://ollama:11434/api/tags 2>/dev/null; do
          echo 'Ollama not ready, waiting...';
          sleep 5;
        done;
        echo 'Ollama is ready!';
        echo 'Pulling Phi-3.5 Mini model...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"phi3.5:3.8b\"}' || true;
        echo 'Pulling Llama 3.2 3B model (backup)...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"llama3.2:3b\"}' || true;
        echo 'Models loaded successfully!';
      "

  # ============================================================================
  # ChromaDB - Vector Database for RAG
  # ============================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: autotest-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma_storage:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=True
    networks:
      - autotest-network
    restart: unless-stopped

  # ============================================================================
  # Redis - Task Queue for Async Processing
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: autotest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - autotest-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ============================================================================
  # Celery Worker - Background Task Processing
  # ============================================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-celery-worker
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./results:/app/results
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - LLAMAPARSE_API_KEY=${LLAMAPARSE_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - chromadb
    networks:
      - autotest-network
    restart: unless-stopped

  # ============================================================================
  # Celery Beat - Periodic Task Scheduler
  # ============================================================================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-celery-beat
    command: celery -A src.tasks.celery_app beat --loglevel=info
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - autotest-network
    restart: unless-stopped

  # ============================================================================
  # Flower - Celery Monitoring Dashboard (Optional)
  # ============================================================================
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-flower
    command: celery -A src.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - celery_worker
    networks:
      - autotest-network
    restart: unless-stopped

  # ============================================================================
  # Frontend Dashboard - Streamlit UI
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotest-frontend
    ports:
      - "8501:8501"
    volumes:
      # Mount for hot reload during development
      - ./frontend:/app
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    networks:
      - autotest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # RL Training Service (Optional - for dedicated RL training)
  # ============================================================================
  rl_trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autotest-rl-trainer
    command: python -m src.rl.train_agent
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8001
    depends_on:
      - chromadb
    networks:
      - autotest-network
    restart: "no"
    profiles:
      - training  # Only start with: docker-compose --profile training up

# ============================================================================
# Networks
# ============================================================================
networks:
  autotest-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  redis_data:
    driver: local
  ollama_data:
    driver: local

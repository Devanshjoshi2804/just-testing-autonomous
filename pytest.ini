[pytest]
# Pytest Configuration for AutoTest-RL
# Unified configuration from Phases 6-10

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage below threshold
    --cov-fail-under=70
    # Warnings
    --strict-markers
    --strict-config
    -W error::DeprecationWarning
    # Performance
    --durations=10
    # Colored output
    --color=yes

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    e2e: End-to-end tests (slowest, full system)
    slow: Tests that take significant time
    fast: Tests that run quickly
    api: Tests for API endpoints
    auth: Authentication tests
    security: Security-related tests
    middleware: Middleware tests
    workflow: Workflow orchestration tests
    rag: RAG system tests
    llm: LLM interaction tests
    requires_ollama: Tests requiring Ollama LLM
    requires_redis: Tests requiring Redis
    requires_chromadb: Tests requiring ChromaDB
    requires_llm: Tests that need LLM service
    asyncio: Asynchronous tests
    smoke: Quick smoke tests
    regression: Regression tests for bugs

# Asyncio configuration
asyncio_mode = auto

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */migrations/*
    */__pycache__/*
    */site-packages/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Fail if coverage is below threshold
fail_under = 70

exclude_lines =
    # Standard pragmas
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    # Don't complain if tests don't hit defensive assertions
    raise AssertionError
    raise NotImplementedError
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about type checking blocks
    if TYPE_CHECKING:

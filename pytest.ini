[pytest]
# Pytest Configuration for AutoTest-RL

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Command line options
addopts =
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config issues)
    --strict-config
    # Verbose output
    -v
    # Show coverage report
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage below threshold
    --cov-fail-under=70
    # Show slowest tests
    --durations=10

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    slow: Tests that take a long time to run
    asyncio: Asynchronous tests
    requires_llm: Tests that need LLM service
    requires_chromadb: Tests that need ChromaDB
    requires_redis: Tests that need Redis
    smoke: Quick smoke tests
    regression: Regression tests for bugs

# Asyncio mode
asyncio_mode = auto

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
